baseURL: "https://emmanueljerez.github.io/"

title: Emmanuel Jerez
copyright: "© Emmanuel Jerez"
paginate: 5
theme: PaperMod
publishDir: "docs" 
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papers"]

minify:
  disableXML: true
  # minifyOutput: true

languages:
  en:
    label: "English"
    locale: "en-US"
    direction: "ltr"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "About"
      url: "/aboutme/"
      weight: 2
    - name: "Publications"
      url: "/papers/"
      weight: 3
    - name: "Talks"
      url: "/talks/"
      weight: 4
    - name: "Contact"
      url: "/contact/"
      weight: 5
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  description: "Academic website of Emmanuel Jerez, a mathematician working in homological algebra, representation theory, graded algebras, and partial group actions."
  author: "Emmanuel Jerez"
  keywords: ["homological algebra", "representation theory", "graded algebras", "partial group actions", "mathematics"]
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: false
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/profile.jpeg"]

  profileMode:
    enabled: true
    title: "Emmanuel Jerez"
    subtitle: >
      Postdoctoral researcher working in homological algebra, representation theory and partial group actions.
    imageUrl: "/images/profile.jpeg"
    imageTitle: "Portrait of Emmanuel Jerez"
    imageWidth: 180
    imageHeight: 180
    buttons:
      - name: "About me"
        url: "/aboutme/"
      - name: "Publications"
        url: "/papers/"

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/emmanueljerez"
    - name: email
      title: Contact me via my email
      url: "mailto:ars.ejerez@icloud.com"

      #  editPost:
      #    URL: "mailto:ejerez.math@gmail.com"
      #    Text: "Suggest Changes" # edit text
      #    appendFilePath: false # to append file path to Edit link

  # label:
